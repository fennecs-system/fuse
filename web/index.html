<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent VM</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script><main><header><span class="badge">PRIVATE WORKSPACE</span><h1>Your coding room.</h1><p>Tools and code live inside the VM.</p></header><label>Control token<input id="token" type="password" autocomplete="off" placeholder="Paste your VM control token"></label><p class="hint">Kept in memory for this tab. Reload to forget it.</p><label>Task<textarea id="prompt" rows="6" placeholder="Clone a repo, investigate a bug, or build something…"></textarea></label><div class="actions"><button id="run">Run task</button><button id="cancel" class="secondary">Stop</button><span id="status" role="status">Disconnected</span></div><h2>Activity</h2><pre id="log" tabindex="0">Enter a token to connect.</pre><p class="hint">One task at a time · 30 minute limit · guest root permitted</p></main></html>
